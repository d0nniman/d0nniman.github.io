<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр GPX треков</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/viewer.css">
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-inner">
                <h2 class="sidebar-name">Меню сайта</h2>
                <ul>
                    <a href="/index.html"><li>GPX конвертер</li></a>
                    <a href="/gpx-viewer.html"><li>Обозреватель треков</li></a>
                </ul>
            </div>
            
        </div>
        <div class="main-content">
            <div class="content-header">
                <h2>🗺️ Обозреватель GPX треков</h2>
                
            </div>
            <!-- Карта -->
            <div class="map-container">
                <div id="map"></div>
            </div>
                <div class="upload-area" id="dropZone">
                    📂 Перетащите GPX файл или нажмите для выбора
                    <input type="file" id="fileInput" accept=".gpx" style="display: none;">
                </div>

        <!-- Статистика -->
            <div class="stats-grid hidden" id="statsPanel">
                <div class="stat-card">
                    <div class="stat-value" id="statDist">0</div>
                    <div class="stat-label">Дистанция (км)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statElev">0</div>
                    <div class="stat-label">Набор высоты (м)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTime">0:00</div>
                    <div class="stat-label">Время в пути</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statPoints">0</div>
                    <div class="stat-label">Точек в треке</div>
                </div>
            </div>
        </div>


        <!-- График высот -->
        <div class="chart-container hidden" id="chartPanel">
            <canvas id="elevationChart"></canvas>
        </div>
    </div>

<!-- Библиотеки -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-gpx@1.7.0/gpx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/gpx-viewer.js"></script>

</body>
</html>
